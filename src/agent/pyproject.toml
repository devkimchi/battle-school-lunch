[project]
name = "school-lunch-agent"
version = "0.1.0"
description = "Microsoft Agent Framework service for comparative school lunch analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-ag-ui==1.0.0",
    "agent-framework-foundry==1.10.3",
    "agent-framework-orchestrations==1.0.1",
    "azure-identity==1.25.3",
    "fastapi==0.138.0",
    "mcp>=1.27,<2",
    "pydantic-settings>=2.5",
    "tzdata>=2026.1",
    "uvicorn[standard]>=0.32",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: pure unit tests with no external I/O",
    "integration: tests that exercise AG-UI or MCP boundaries with fakes",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.0",
    "respx>=0.21",
]
