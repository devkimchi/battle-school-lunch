[project]
name = "school-lunch-mcp"
description = "OpenAPI-driven MCP server for the NEIS school and lunch APIs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "mcp>=1.27,<2",
    "pydantic-settings>=2.5",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: pure unit tests with no external I/O",
    "integration: tests that exercise MCP protocol or HTTP boundaries with mocked NEIS",
]
