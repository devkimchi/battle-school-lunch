<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1134" height="1642" viewBox="0 0 1134 1642" role="img" aria-labelledby="title description">
  <title id="title">학교 급식 조회 및 멀티에이전트 분석 아키텍처</title>
  <desc id="description">기존 이미지의 배치와 아이콘을 유지한 아키텍처입니다. Web UI는 API와 Agent에 요청하며, API와 MCP는 NEIS를 조회합니다. Agent 서비스 내부에서 전문 에이전트를 병렬 실행하고 점수를 계산한 뒤 AI Judge가 결과를 종합합니다. 에이전트는 Copilot SDK를 통해 GitHub Copilot을 호출합니다.</desc>
  <!-- The original raster artwork is preserved separately; the labels below are editable. -->
  <image x="0" y="0" width="1134" height="1642" xlink:href="architecture-original.png"/>

  <g fill="#000000" font-family="Arial, Helvetica, sans-serif">
    <text x="135" y="813" text-anchor="middle" font-size="19">→ NEIS Open API</text>
    <text x="1029" y="813" text-anchor="middle" font-size="19">→ NEIS Open API</text>
    <text x="85" y="1583" font-size="25">Agent Service workflow</text>
    <text x="85" y="1615" font-size="22">Weights in code: 45% / 30% / 25%</text>
  </g>

  <rect x="790" y="1555" width="335" height="75" fill="#ffffff"/>
  <g fill="#000000" font-family="Arial, Helvetica, sans-serif" text-anchor="end">
    <text x="1105" y="1582" font-size="26">Microsoft Agent Framework</text>
    <text x="1105" y="1616" font-size="22">Copilot SDK → GitHub Copilot</text>
  </g>
</svg>
